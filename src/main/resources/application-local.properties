# ???????????????????????????????????????????????????????????????????
#  application-local.properties  ?  local development overrides
#  Activated by: spring.profiles.active=local
#  These values override application.properties when running locally.
#  NEVER commit real secrets ? use env vars or keep this file in .gitignore
# ???????????????????????????????????????????????????????????????????

server.port=8081

# ?? PostgreSQL (local Docker or native install) ???????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/journaldb
spring.datasource.username=postgres
spring.datasource.password=postgres

# ?? JPA / Hibernate ???????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ?? Redis (local Docker) ??????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379
# No password for local Redis ? comment out to disable auth
# spring.data.redis.password=

# ?? Kafka (local Docker ? no SASL, plain text) ????????????????????
spring.kafka.bootstrap-servers=localhost:9092

# Override ? disable SASL for local plain-text broker
spring.kafka.properties.security.protocol=PLAINTEXT
spring.kafka.properties.sasl.mechanism=
spring.kafka.properties.sasl.jaas.config=

# ?? Secrets (set these as env vars or fill in temporarily for local) ?
spring.jwt.secret.key=${JWT_SECRET_KEY:local-dev-secret-key-minimum-32-chars!!}
weather.api.key=${WEATHER_API_KEY:your_local_weather_key}
gemini.api.key=${GEMINI_API_KEY:your_local_gemini_key}
spring.mail.username=${SMTP_USERNAME:your_email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your_app_password}

# ?? Logging (more verbose locally) ???????????????????????????????
logging.level.com.trishal.journalApp=DEBUG
logging.level.org.springframework.security=INFO

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method