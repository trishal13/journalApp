# ???????????????????????????????????????????????????????????????????
#  application.properties  ?  shared / production config
#  Secrets are injected as environment variables.
#  Local overrides live in application-local.properties
# ???????????????????????????????????????????????????????????????????

spring.application.name=Journal App
spring.profiles.active=dev

# ?? Logging ???????????????????????????????????????????????????????
# logging.level.root=ERROR
# logging.level.com.trishal.journalApp=DEBUG
# logging.level.com.trishal.journalApp.service.UserService=OFF
logging.level.com.trishal.journalApp=INFO

# ?? Swagger UI ????????????????????????????????????????????????????
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

# ?? JWT ???????????????????????????????????????????????????????????
spring.jwt.secret.key=${JWT_SECRET_KEY}

# ?? Weather API ???????????????????????????????????????????????????
weather.api.key=${WEATHER_API_KEY}

# ?? Gemini API ????????????????????????????????????????????????????
gemini.api.key=${GEMINI_API_KEY}

# ?? Mail (Gmail SMTP) ?????????????????????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
# FIX: correct JavaMail property key (was mail.smtp.auth.starttls.enable)
spring.mail.properties.mail.smtp.starttls.enable=true

# ?? Redis (Redis Cloud) ???????????????????????????????????????????
spring.data.redis.host=redis-14109.c301.ap-south-1-1.ec2.redns.redis-cloud.com
spring.data.redis.port=14109
spring.data.redis.password=${REDIS_CLOUD_PASSWORD}

# ?? HikariCP  (keep well below Supabase connection limit) ?????????
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0

# ?? Kafka (Redpanda Cloud ? SASL_SSL) ????????????????????????????
spring.kafka.bootstrap-servers=d33doa44ovosl8h0cb0g.any.ap-south-1.mpx.prd.cloud.redpanda.com:9092

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
spring.kafka.properties.session.timeout.ms=45000

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.group-id=weekly-sentiment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.trishal.journalApp.model

# ?? Kafka topic / group constants ?????????????????????????????????
weekly.sentiment.topic=weekly-sentiments
weekly.sentiment.group=weekly-sentiments

# ?? Actuator ??????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ?? Actuator (used by Docker health check) ????????????????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always